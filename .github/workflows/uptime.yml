name: Uptime check

# Runs against your own deployment, and only when the repository variable HEALTHCHECK_URL is set
# (Settings > Secrets and variables > Actions > Variables). A failed run is the alert: GitHub emails
# the person who last changed this schedule. Nothing here holds a token, and no address is committed.
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable them if so.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: ${{ vars.HEALTHCHECK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check the deployment
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: node scripts/health-check.mjs
