name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Public site tests
        run: npm run site:test
      - name: Public site checks
        run: npm run site:check
      - name: Worker bundle dry run
        run: npm run deploy:dry
      - name: First-run smoke test (fresh clone, no Cloudflare login)
        run: npm run smoke
      - name: Browser check (landing page in Chrome)
        run: npm run browser-check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
