<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>Script and style with CDATA</title>
<style type="text/css"><![CDATA[
p { margin: 0 }
]]></style>
<script type="text/javascript"><![CDATA[
var a = 1 < 2;
]]></script>
</head>
<body>
<p>A paragraph beside the script.</p>
</body>
</html>
